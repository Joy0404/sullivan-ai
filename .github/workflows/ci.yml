name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: sullivan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sullivan_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Disposable CI-only database. Never use production credentials here.
      TEST_DATABASE_URL: postgresql://postgres:ci-only@127.0.0.1:5432/sullivan_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install API dependencies
        run: pip install -r apps/api/requirements.txt
      - name: Build app checks
        run: npm run build
      - name: Run all existing and public-service checks
        run: sh scripts/verify_all.sh

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build deployment image
        run: docker build --tag sullivan-ci .
      - name: Run API tests in the deployment Python image
        run: >-
          docker run --rm
          --mount type=bind,src="${{ github.workspace }}",dst=/checks,readonly
          --workdir /checks/apps/api --env PYTHONPATH=.
          sullivan-ci python -m pytest -q -p no:cacheprovider
      - name: Inspect deployment image for excluded files
        run: >-
          docker run --rm sullivan-ci python -c
          "from pathlib import Path; p=list(Path('/app').rglob('*')); assert not any(x.name in {'.env','__pycache__','.pytest_cache','.git'} for x in p); print('PASS: clean deployment image')"
      - name: Start credential-free service on a custom PORT
        run: docker run --detach --name sullivan-ci --publish 127.0.0.1:18080:8765 --env PORT=8765 sullivan-ci
      - name: Verify web, API, health and sample behavior
        run: python scripts/smoke_service.py http://127.0.0.1:18080 --allow-local
      - name: Stop test container
        if: always()
        run: docker rm --force sullivan-ci || true

  extensions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser verification dependencies
        run: |
          pip install -r apps/api/requirements.txt -r scripts/requirements-extension-tests.txt
          python -m playwright install --with-deps chromium
          npm install --prefix "$RUNNER_TEMP/sullivan-a11y" --ignore-scripts axe-core@4.14.0
      - name: Verify two installed extensions and account lifecycle
        env:
          SULLIVAN_AXE_SOURCE: ${{ runner.temp }}/sullivan-a11y/node_modules/axe-core/axe.min.js
        run: |
          python scripts/verify_extensions.py
      - name: Package local development artifacts
        run: python scripts/package_extensions.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extension-development-verification
          path: |
            dist/releases/
            docs/verification/2026-11-14-fixes/
            docs/verification/2026-11-14-followup/
            docs/verification/extension-optimization/
            docs/verification/extension-acceptance/
            docs/verification/extension-*.json
            docs/verification/extension-*.png
          if-no-files-found: warn
