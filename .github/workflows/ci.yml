name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Install API dependencies
        run: pip install -r apps/api/requirements.txt
      - name: Run API tests
        working-directory: apps/api
        run: PYTHONPATH=. pytest -q
      - name: Validate analysis schema JSON
        run: python -m json.tool packages/contracts/events.schema.json > /dev/null
      - name: Run project safety verification
        run: python scripts/verify_project.py
      - name: Check web JavaScript syntax
        run: node --check apps/web/app.js
