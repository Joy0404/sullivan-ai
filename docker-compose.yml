services:
  app:
    build: .
    environment:
      PORT: "8000"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DEMO_ACCESS_CODE: ${DEMO_ACCESS_CODE:-}
      DEMO_DAILY_LIMIT: ${DEMO_DAILY_LIMIT:-3}
      ALLOWED_SAMPLE_VIDEO_IDS: ${ALLOWED_SAMPLE_VIDEO_IDS:-R0dqsl3Vgns,thJxqtTgSNY}
      ANALYSIS_TIMEOUT_SECONDS: ${ANALYSIS_TIMEOUT_SECONDS:-180}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_FALLBACK_MODEL: ${GEMINI_FALLBACK_MODEL:-gemini-2.5-flash}
      GEMINI_AGENT_MODEL: ${GEMINI_AGENT_MODEL:-gemini-2.5-flash}
      MAX_UPLOAD_VIDEO_BYTES: ${MAX_UPLOAD_VIDEO_BYTES:-104857600}
    ports:
      - "8000:8000"
