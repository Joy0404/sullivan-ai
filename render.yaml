# Render Blueprint: one Docker web service that serves the API and the web app.
# Secrets (sync: false) are entered in the Render dashboard, never committed.
services:
  - type: web
    name: sullivan-ai
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: DEMO_ACCESS_CODE
        sync: false
      - key: DEMO_DAILY_LIMIT
        value: "3"
      - key: ALLOWED_SAMPLE_VIDEO_IDS
        value: R0dqsl3Vgns,thJxqtTgSNY
      - key: ANALYSIS_TIMEOUT_SECONDS
        value: "180"
      - key: MAX_UPLOAD_VIDEO_BYTES
        value: "104857600"
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_AGENT_MODEL
        value: gemini-2.5-flash
      - key: APP_ENV
        value: production
