# Free web service; shared quota is stored in external Neon PostgreSQL.
services:
  - type: web
    name: sullivan-ai
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    numInstances: 1
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: DEMO_ACCESS_CODE
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: TRUST_RENDER_PROXY
        value: "1"
      - key: DEMO_DAILY_LIMIT
        value: "3"
      - key: ALLOWED_SAMPLE_VIDEO_IDS
        value: R0dqsl3Vgns,thJxqtTgSNY
      - key: ANALYSIS_TIMEOUT_SECONDS
        value: "180"
      - key: MAX_UPLOAD_VIDEO_BYTES
        value: "100000000"
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_AGENT_MODEL
        value: gemini-2.5-flash
      - key: APP_ENV
        value: production
